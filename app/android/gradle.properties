# Serveur de build : 8 Go de RAM partagés avec le stack docker. Le défaut
# Flutter (-Xmx8G, metaspace 4G) épuisait toute la mémoire — plus rien pour
# sshd ni le reste, serveur figé, reboot obligatoire.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
